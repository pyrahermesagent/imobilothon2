<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Codebase Artifacts</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <!-- Repository list -->
  <section id="repo-view">
    <div class="repo-card">
      <div class="repo-eyebrow">Repositories</div>
      <div id="repo-list" class="repo-list"></div>
    </div>
  </section>

  <!-- Document view -->
  <section id="doc-view">
    <aside id="panel">
      <button id="back" class="back" title="Back to repositories">
        <span data-lucide="chevron-left"></span>
        <span id="repo-name" class="name"></span>
      </button>
      <nav id="doc-list" class="doc-list" aria-label="Artifacts"></nav>
    </aside>

    <main id="view">
      <div id="doc-content" class="doc"></div>
    </main>
  </section>

  <script src="/vendor/marked.min.js"></script>
  <script src="/vendor/mermaid.min.js"></script>
  <script src="/vendor/lucide.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
